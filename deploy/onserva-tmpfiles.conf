# The spool the agent's two halves meet in, recreated on every boot.
#
# /run is a tmpfs, so these vanish with a reboot — which is the behaviour we
# want. An authorisation that survived a restart and fired hours later would be
# an action nobody remembers approving.
#
# The permissions are the security boundary:
#
#   requests/  0730 root:onserva  the agent may write and traverse, NOT list.
#                                 It has no business reading what else is queued.
#   results/   0750 root:onserva  the agent may read and list, NOT write.
#                                 It must not be able to forge an outcome.
#
d /run/onserva          0755 root root    -
d /run/onserva/requests 0730 root onserva -
d /run/onserva/results  0750 root onserva -
